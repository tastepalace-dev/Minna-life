<style>
:root{--bg:#edf1e8;--card:#fffdf6;--ink:#203126;--muted:#68756b;--green:#245b3e;--gold:#e0a936;--line:#d9e0d5}

h1{font-size:28px;margin:0;color:var(--green)}h2{font-size:18px;margin:0 0 9px}.sub{color:var(--muted);margin:3px 0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:12px 0}
button,input{font:inherit;border-radius:10px;padding:10px;border:1px solid var(--line)}button{background:var(--green);color:white;font-weight:700;cursor:pointer;border:0;min-height:40px;touch-action:manipulation}button.gold{background:var(--gold);color:#30230a}button:disabled{opacity:.5}input{width:100%;background:white;color:#203126;margin:6px 0}

<body>
<header><h1>Minna Life</h1><p class="sub">Explore Minna, earn money, eat, work and build your life.</p></header><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
"use strict";
const XJ=[["Okada rider",3800,28,16,"okada"],["Keke driver",4600,30,18,"keke"],["Chauffeur driver",7000,32,20,"car"]];
const TOWNS={
minna:{name:"Minna",desc:"State capital — markets, schools, homes and busy roads.",jobs:[["Keke rider",2500,24,14],["Market trader",2000,20,12],["Recharge-card seller",1700,15,10],["Shop assistant",2200,18,12]].concat(XJ),food:[["Jollof rice",1200,40],["Shawarma",2500,35],["Eba and egusi soup",1000,45],["Tuwo and miyan kuka",800,40],["Suya",1500,30],["Rice and beans",900,35]]},
bida:{name:"Bida",desc:"Nupe heritage, crafts and farming.",jobs:[["Brass worker",3200,30,18],["Farmer",2200,28,16],["Fura da nono seller",1800,15,10]].concat(XJ),food:[["Gbegi and egusi",900,40],["Fura da nono",500,20],["Jollof rice",1200,40],["Eba and egusi soup",1000,45],["Shawarma",2500,35]]},
suleja:{name:"Suleja",desc:"A busy town close to Abuja.",jobs:[["Bus conductor",2600,22,14],["Market trader",2300,20,12],["Tour guide",3000,22,12]].concat(XJ),food:[["Jollof and chicken",1800,45],["Akara and pap",600,25],["Shawarma",2500,35],["Eba and egusi soup",1000,45]]}};
const HOMES=[["Sleep outside",0,45],["Single room",1500,85],["Self-contain",4000,100],["Two-bedroom flat",10000,100],["Duplex",25000,100],["Mansion",60000,100]],KEY="minnaLifeSaveV2";
let S=null,px=180,py=245,ctx=null,world=null,db=null,uid=null,chatRef=null;
const VEH=[["bicycle","Bicycle",30000,"🚲",1.5,.10,.05],["okada","Motorbike (Okada)",150000,"🏍️",2,.25,.10],["keke","Keke Napep",400000,"🛺",2,.30,.15],["car","Toyota Corolla",1200000,"🚗",2.5,.50,.25],["hilux","Toyota Hilux",2500000,"🛻",2.5,.60,.30],["benz","Mercedes Benz",5000000,"🚘",3,1,.50],["lexus","Lexus SUV",8000000,"🚙",3,1,.60],["gwagon","G-Wagon",15000000,"🚐",3,1,.75],["jet","Private jet",100000000,"✈️",3,1,1]];
const BIZ=[["suya","Suya joint",120000,900],["pepper","Pepper-soup spot",200000,1500],["store","Provision store",350000,2500],["plot","Plot of land, Bosso",800000,5000],["guest","Guest house, Suleja",2500000,16000]];
const GEN=["gen","Generator",80000];
function best(){let b=null;VEH.forEach(v=>{if((S&&S.items||{})[v[0]])b=v});return b}
function spd(){let b=best();return b?b[4]:1}
function buyV(i){let v=VEH[i];if(!v||S.items[v[0]])return;if(S.cash<v[2]){say("You need "+money(v[2])+" for the "+v[1]+".");render();return}S.cash-=v[2];S.items[v[0]]=true;say("You bought a "+v[1]+"! "+v[3]);save();render()}
function buyB(i){let b=BIZ[i];if(!b||S.biz[b[0]])return;if(S.cash<b[2]){say("You need "+money(b[2])+" to open the "+b[1]+".");render();return}S.cash-=b[2];S.biz[b[0]]=true;say("You opened a "+b[1]+". It will earn money every night.");save();render()}
function buyG(){if(S.items.gen)return;if(S.cash<GEN[2]){say("You need "+money(GEN[2])+" for a generator.");render();return}S.cash-=GEN[2];S.items.gen=true;say("You bought a generator. NEPA cannot disturb you now.");save();render()}
function passive(){if((S.debt||0)>0){let i=Math.round(S.debt*.05);S.debt+=i;say("Loan interest: "+money(i)+". You owe "+money(S.debt)+".")}let t=0;BIZ.forEach(b=>{if(S.biz&&S.biz[b[0]])t+=b[3]});if(t){S.cash+=t;say("Your businesses earned "+money(t)+" overnight.")}}
function dayEvent(){let r=Math.random();if(r<.25){if(S.items&&S.items.gen)say("NEPA took light, but your generator saved the night.");else{let l=Math.min(S.cash,800);S.cash-=l;S.food=clamp(S.food-10);say("NEPA took light all night. Your food spoiled"+(l?" and you spent "+money(l)+" on fuel and candles":"")+".")}}else if(r<.40)say("Heavy rain this morning. The roads are slippery.");else if(r<.55){let g=300+Math.floor(Math.random()*7)*100;S.cash+=g;say("You found "+money(g)+" in an old jacket.")}else if(r<.65){let l=Math.min(S.cash,500);S.cash-=l;if(l)say("Police stopped you and asked you to settle: "+money(l)+".")}else if(r<.75){S.food=clamp(S.food+30);say("There was an owambe on your street. You ate free jollof rice and zobo.")}}
function storeHTML(){let it=S.items||{},bz=S.biz||{};
let h='<div class="card"><h2>Garage</h2>'+VEH.map((v,i)=>`<div class="row"><div>${v[3]} ${esc(v[1])}<small>${money(v[2])} · speed x${v[4]} · fares -${Math.round(v[5]*100)}% · earnings +${Math.round(v[6]*100)}%</small></div><button class="${it[v[0]]?"":"gold"}" ${it[v[0]]?"disabled":""} onclick="buyV(${i})">${it[v[0]]?"Owned":"Buy"}</button></div>`).join("")+'</div>';
h+='<div class="card"><h2>Businesses and gadgets</h2>'+BIZ.map((b,i)=>`<div class="row"><div>${esc(b[1])}<small>${money(b[2])} · earns ${money(b[3])} every night</small></div><button class="${bz[b[0]]?"":"gold"}" ${bz[b[0]]?"disabled":""} onclick="buyB(${i})">${bz[b[0]]?"Owned":"Buy"}</button></div>`).join("")+`<div class="row"><div>${GEN[1]}<small>${money(GEN[2])} · protects you from NEPA at night</small></div><button class="${it.gen?"":"gold"}" ${it.gen?"disabled":""} onclick="buyG()">${it.gen?"Owned":"Buy"}</button></div></div>`;
return h}
const SCHOOL=[["Computer training",25000,8],["Driving school",40000,8],["Business course",80000,16]];
let SND=true,AC=null;
function beep(){if(!SND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=660;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();o.frequency.setTargetAtTime(990,AC.currentTime,.05);o.stop(AC.currentTime+.16)}catch(e){}}
function toggleSnd(){SND=!SND;render()}
function title(){let n=S.cash-(S.debt||0),r="Talaka";[[50000,"Hustler"],[500000,"Big Man"],[5000000,"Alhaji / Chief"],[50000000,"Dangote level"]].forEach(x=>{if(n>=x[0])r=x[1]});return r}
function daily(){let d=new Date().toDateString();if(S.claimedDate===d){say("You already claimed today. Come back tomorrow.");render();return}S.claimedDate=d;S.cash+=2000;say("Daily bonus: you received "+money(2000)+".");save();render()}
function borrow(){if((S.debt||0)>=100000){say("The lender says you owe too much already.");render();return}S.cash+=20000;S.debt=(S.debt||0)+20000;say("You borrowed "+money(20000)+". Repay before the interest grows.");save();render()}
function repay(){let p=Math.min(S.cash,S.debt||0);if(p<=0){say("Nothing to repay, or you have no cash.");render();return}S.cash-=p;S.debt-=p;say("You repaid "+money(p)+".");save();render()}
function learn(i){let c=SCHOOL[i];if(!c||S.learn[i])return;if(S.cash<c[1]){say("You need "+money(c[1])+" for "+c[0]+".");render();return}S.cash-=c[1];S.learn[i]=true;S.xp+=c[2];say("You finished "+c[0]+". Your earnings went up.");save();render()}
function moreHTML(){let got=S.claimedDate===new Date().toDateString(),lr=S.learn||{};
return `<div class="card"><h2>Daily bonus</h2><div class="row"><div>Free gift every day<small>${money(2000)} once per real day</small></div><button class="${got?"":"gold"}" ${got?"disabled":""} onclick="daily()">${got?"Claimed":"Claim"}</button></div></div>
<div class="card"><h2>Microloan</h2><div class="row"><div>You owe ${money(S.debt||0)}<small>Borrow ${money(20000)} at a time. 5% interest every night. Max ${money(100000)}.</small></div><div style="display:flex;gap:6px"><button class="gold" onclick="borrow()">Borrow</button><button onclick="repay()" ${S.debt?"":"disabled"}>Repay</button></div></div></div>
<div class="card"><h2>School</h2>${SCHOOL.map((c,i)=>`<div class="row"><div>${esc(c[0])}<small>${money(c[1])} · earnings +${Math.round(c[2]/8*10)}%</small></div><button class="${lr[i]?"":"gold"}" ${lr[i]?"disabled":""} onclick="learn(${i})">${lr[i]?"Done":"Enrol"}</button></div>`).join("")}</div>`}
const PARTY=[["Enter and dance",3000,25,10,"+2 connections, you get tired"],["Buy a VIP table",25000,20,5,"+10 connections, may meet a client"],["Spray money",10000,10,0,"+5 connections"]];
const GOODS=[["phone","Smartphone",60000,"📱",.05,0],["laptop","Laptop",250000,"💻",.08,0],["outfit","Designer outfit",120000,"👔",0,8],["chain","Gold chain",400000,"📿",0,15],["iphone","iPhone Pro",900000,"📲",0,10],["watch","Luxury watch",1500000,"⌚",.05,20]];
const NPCN={minna:[["Mama Put",["Come chop rice o! Hot jollof!","Abeg, no be say money dey?"]],["Keke Man",["Bosso, Tunga, Maitumbi! Enter!","This fuel price is wicked."]],["Student",["FUT assignment will kill me.","Do you know where the cheap shawarma is?"]]],bida:[["Brass Smith",["Our brass work travels the world.","Patience makes the best pot."]],["Fura Seller",["Fura da nono, cold and sweet!","Early customers get a discount."]],["Farmer",["The rain has been kind this year.","Come and see my yam farm."]]],suleja:[["Conductor",["Madalla, Zuma, Abuja! Enter!","Passengers, move inside!"]],["Trader",["Fresh tomatoes, best price!","Abuja people dey pay well."]],["Okada Guy",["Where you dey go? I carry you.","Traffic to Abuja is mad today."]]]};
let npcs=[],trf=[],npcTown=null,tk=0;
function isNight(){let h=new Date().getHours();return h>=19||h<6}
function goodsBonus(){let t=0;GOODS.forEach(g=>{if((S&&S.items||{})[g[0]])t+=g[4]});return t}
function buyGood(i){let g=GOODS[i];if(!g||S.items[g[0]])return;if(S.cash<g[2]){say("You need "+money(g[2])+" for the "+g[1]+".");render();return}S.cash-=g[2];S.items[g[0]]=true;S.fame=(S.fame||0)+g[5];say("You bought a "+g[1]+". "+g[3]);save();render()}
function party(i){let x=PARTY[i];if(!x)return;if(!isNight()){say("The club is closed. It opens at 7 PM.");render();return}if(S.cash<x[1]){say("You need "+money(x[1])+" for that.");render();return}if(S.energy<x[2]){say("You are too tired to party.");render();return}
S.cash-=x[1];S.energy=clamp(S.energy-x[2]);S.food=clamp(S.food-x[3]);S.fame=(S.fame||0)+[2,10,5][i];
if(i===0&&Math.random()<.2){S.cash+=8000;say("You danced all night and met a client who paid you "+money(8000)+".")}
else if(i===1&&Math.random()<.4){S.cash+=40000;say("A big man at your table offered you a deal worth "+money(40000)+".")}
else say("What a night! Your connections grew to "+S.fame+".");
save();render()}
function goodsHTML(){let it=S.items||{};return `<div class="card"><h2>Shopping</h2>${GOODS.map((g,i)=>`<div class="row"><div>${g[3]} ${esc(g[1])}<small>${money(g[2])} · ${g[4]?"earnings +"+Math.round(g[4]*100)+"%":""}${g[4]&&g[5]?" · ":""}${g[5]?"+"+g[5]+" connections":""}</small></div><button class="${it[g[0]]?"":"gold"}" ${it[g[0]]?"disabled":""} onclick="buyGood(${i})">${it[g[0]]?"Owned":"Buy"}</button></div>`).join("")}</div>`}
function initNPC(){npcTown=S.town;let nm=NPCN[S.town]||NPCN.minna;npcs=nm.map((x,i)=>{let h=i%2===0,px0=h?40+i*90:178,py0=h?255:100+i*120;return{n:x[0],lines:x[1],h:h,x:px0,y:py0,tx:px0,ty:py0,w:0}});trf=[{e:"🚗",x:-20,y:228,dx:1.6,dy:0},{e:"🛺",x:380,y:282,dx:-1.2,dy:0},{e:"🚌",x:160,y:-20,dx:0,dy:1.4},{e:"🏍️",x:200,y:520,dx:0,dy:-1.8}]}
function stepWorld(){if(npcTown!==S.town)initNPC();npcs.forEach(n=>{if(n.w>0){n.w--;return}let dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);if(d<2){n.w=Math.random()<.5?20+Math.floor(Math.random()*40):0;if(n.h){n.tx=15+Math.random()*330;n.ty=228+Math.random()*50}else{n.tx=150+Math.random()*60;n.ty=15+Math.random()*470}}else{n.x+=dx/d*1.1;n.y+=dy/d*1.1}});trf.forEach(v=>{v.x+=v.dx;v.y+=v.dy;if(v.x>400)v.x=-30;if(v.x<-40)v.x=390;if(v.y>540)v.y=-30;if(v.y<-40)v.y=530})}
function nearNPC(){let b=null,bd=42;npcs.forEach(n=>{let d=Math.hypot(n.x-px,n.y-py);if(d<bd){bd=d;b=n}});return b}
function tick(){if(!S||!ctx)return;stepWorld();drawWorld();if(++tk%8===0)updateNear()}
const ADS={minna:["Chicken Republic","Haske Luxury Hotel"],bida:["Taste Palace","Mabrur"],suleja:["Mac Hotels and Resorts","Brookville Hotel and Suites"]};
function wrap(t,n){let l=[""];t.split(" ").forEach(x=>{let c=l[l.length-1],j=(c+" "+x).trim();if(j.length<=n)l[l.length-1]=j;else l.push(x)});return l}
const THEME={minna:{g:"#a5ce88",g2:"#8fbd78",road:"#858982",l:["FOOD MARKET","MINNA SHOP","HOUSE","CLINIC"]},bida:{g:"#cfd79c",g2:"#bcc687",road:"#a68c68",l:["FOOD MARKET","BRASS MARKET","HOUSE","CLINIC"]},suleja:{g:"#98cf8f",g2:"#7fbb78",road:"#6e7470",l:["FOOD MARKET","MADALLA MARKET","HOUSE","CLINIC"]}};
let BB={},bbRef=null,lastNear="",others={},posTown=null,lastPos=0,mpText="Connecting to multiplayer…",chatHTML='<p class="muted">No messages yet.</p>',boardHTML='<p class="muted">Loading…</p>';
function money(n){return "₦"+Math.round(n).toLocaleString("en-NG")}function clamp(n){return Math.max(0,Math.min(100,n))}
function say(m){S.log.unshift(m);S.log=S.log.slice(0,6);beep()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncPlayer()}
function load(){try{let v=localStorage.getItem(KEY);if(v){S=JSON.parse(v);S.log=S.log||[];if(!TOWNS[S.town])S.town="minna";S.cash=Number(S.cash)||0;S.energy=clamp(Number(S.energy)||0);S.food=clamp(Number(S.food)||0)}}catch(e){S=null}}
function start(type){let f=document.getElementById("playerName"),name=f?f.value.trim().slice(0,20):"";if(!name){alert("Enter a character name first.");return}S={name,cash:type==="comfortable"?50000:1500,energy:100,food:80,day:1,town:"minna",home:type==="comfortable"?1:0,xp:0,log:["Welcome to Minna, "+name+"! Your journey begins."]};px=180;py=245;save();joinTown();render()}
function multiplier(){return 1+Math.floor((S.xp||0)/8)*.1+(best()?best()[6]:0)+goodsBonus()+Math.min(.2,(S.fame||0)*.01)}
function work(i){let j=TOWNS[S.town].jobs[i];if(!j)return;if(j[4]&&!(S.items||{})[j[4]]){say("You need a "+((VEH.find(v=>v[0]===j[4])||[])[1]||"vehicle")+" for this job.");render();return}if(S.energy<j[2]){say("You're tired. Sleep to restore energy.");render();return}if(S.food<10){say("You're too hungry to work. Eat first.");render();return}let pay=Math.round(j[1]*multiplier());if(Math.random()<.2){let tip=Math.round(pay*.3);pay+=tip;say("A customer tipped you "+money(tip)+"!")}if(Math.random()<.1){pay=Math.round(pay*.5);say("A customer did not pay in full.")}S.cash+=pay;S.energy=clamp(S.energy-j[2]);S.food=clamp(S.food-j[3]);S.xp++;say(j[0]+": you earned "+money(pay)+".");save();render()}
function eat(i){let f=TOWNS[S.town].food[i];if(!f)return;if(S.cash<f[1]){say("Not enough money for "+f[0]+".");render();return}S.cash-=f[1];S.food=clamp(S.food+f[2]);say("You ate "+f[0]+" for "+money(f[1])+".");save();render()}
function sleep(){let h=HOMES[S.home]||HOMES[0];if(S.energy>=90){say("You are not sleepy yet. Work or travel first.");render();return}if(S.cash<h[1]){say("You can't afford to sleep here tonight.");render();return}S.cash-=h[1];S.energy=clamp(S.energy+h[2]);S.food=clamp(S.food-20);S.day++;say("Day "+S.day+": rested at "+h[0]+".");if(S.home===0&&Math.random()<.2){let loss=Math.min(S.cash,500);S.cash-=loss;if(loss)say("You lost "+money(loss)+" while sleeping outside.")}passive();dayEvent();save();render()}
function chooseHome(i){if(!HOMES[i])return;S.home=i;say("Your home is now: "+HOMES[i][0]+".");save();render()}
function travel(t){if(!TOWNS[t]||t===S.town)return;let costs={minna:{bida:2000,suleja:3000},bida:{minna:2000,suleja:4500},suleja:{minna:3000,bida:4500}},cost=Math.round(((costs[S.town]||{})[t]||0)*(1-(best()?best()[5]:0)));if(S.cash<cost){say("You need "+money(cost)+" for that trip.");render();return}S.cash-=cost;S.energy=clamp(S.energy-10);S.town=t;px=180;py=245;joinTown();say("You travelled to "+TOWNS[t].name+" for "+money(cost)+".");save();render()}
function bar(l,v,c){return `<div>${l} ${Math.round(v)}%<div class="bar"><i style="width:${v}%;background:${c}"></i></div></div>`}
function render(){let a=document.getElementById("app");let oldCi=document.getElementById("chatInput"),keep=oldCi?oldCi.value:"";if(!S){a.innerHTML=`<div class="card"><h2>Create your character</h2><label for="playerName">Character name</label><input id="playerName" maxlength="20" placeholder="e.g. Musa"><button style="width:100%;margin:4px 0 8px" onclick="start('comfortable')">Comfortable start — ₦50,000</button><button class="gold" style="width:100%" onclick="start('hustle')">Hustle start — ₦1,500</button></div>`;return}
S.home=Number.isInteger(S.home)?Math.max(0,Math.min(HOMES.length-1,S.home)):0;S.xp=Number(S.xp)||0;S.items=S.items||{};S.biz=S.biz||{};S.learn=S.learn||{};S.fame=Number(S.fame)||0;S.debt=Number(S.debt)||0;
a.innerHTML=`<div class="card"><div class="row" style="border:0;padding-top:0"><div><b>${esc(S.name)}</b><small>${title()} · ${S.fame||0} connections · Day ${S.day} · Earnings bonus ×${multiplier().toFixed(1)}</small></div><div style="display:flex;gap:6px"><button class="gold" onclick="toggleSnd()">${SND?"🔊":"🔇"}</button><button class="gold" onclick="resetGame()">Reset</button></div></div><h2>${money(S.cash)}</h2><div class="stats">${bar("Energy",S.energy,"#2c8d9a")}${bar("Fullness",S.food,"#d8a12e")}</div></div>

const obstacles=[{x:8,y:35,w:103,h:61},{x:244,y:35,w:103,h:61},{x:11,y:338,w:108,h:82},{x:241,y:338,w:108,h:82},{x:12,y:100,w:100,h:36},{x:244,y:100,w:104,h:36}];
const BLD=[{k:"food",x:8,y:35,w:103,h:61,n:"Food Market"},{k:"shop",x:244,y:35,w:103,h:61,n:"Shop"},{k:"home",x:11,y:338,w:108,h:82,n:"Your House"},{k:"clinic",x:241,y:338,w:108,h:82,n:"Clinic"},{k:"club",x:244,y:100,w:104,h:36,n:"Night Club"}];
function nearB(){let r=null,bd=50;BLD.forEach(b=>{let dx=Math.max(b.x-px,0,px-(b.x+b.w)),dy=Math.max(b.y-py,0,py-(b.y+b.h)),d=Math.hypot(dx,dy);if(d<bd){bd=d;r=b}});return r}
function heal(){if(S.cash<1500){say("You can't afford treatment (\u20A61,500).");render();return}S.cash-=1500;S.energy=clamp(S.energy+40);S.food=clamp(S.food+20);say("The clinic treated you for \u20A61,500.");save();render()}
function updateNear(){let el=document.getElementById("near");if(!el||!S)return;let b=nearB(),nn=b?null:nearNPC(),ln=nn?Math.floor(Date.now()/9000)%nn.lines.length:0,key=b?b.k+S.town+isNight():(nn?"npc"+nn.n+ln:"none");if(key===lastNear&&el.innerHTML)return;lastNear=key;if(nn){el.innerHTML="<h2>"+esc(nn.n)+' <span class="muted">(townsperson)</span></h2><p>\u201C'+esc(nn.lines[ln])+"\u201D</p>";return}if(!b){el.innerHTML='<h2>Around you</h2><p class="muted">Walk up to a building to go inside: Food Market, Shop, House or Clinic.</p>';return}

function collides(x,y){let r=9;return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
function move(dx,dy){if(!S||!world)return;let f=Math.min(spd(),2);dx*=f;dy*=f;let nx=Math.max(10,Math.min(350,px+dx)),ny=Math.max(12,Math.min(475,py+dy));if(!collides(nx,py))px=nx;if(!collides(px,ny))py=ny;drawWorld();pushPos();updateNear()}
function tapMove(e){if(!world||!S)return;let r=world.getBoundingClientRect(),tx=(e.clientX-r.left)*360/r.width,ty=(e.clientY-r.top)*500/r.height,dx=tx-px,dy=ty-py,d=Math.hypot(dx,dy);if(d<8)return;let sp=8*Math.min(spd(),2.2),steps=Math.ceil(d/sp),step=0;function animate(){if(step++>=steps)return;let ox=px,oy=py,nx=px+dx/d*sp,ny=py+dy/d*sp;if(!collides(nx,py))px=nx;if(!collides(px,ny))py=ny;drawWorld();pushPos();updateNear();if(px===ox&&py===oy)return;requestAnimationFrame(animate)}requestAnimationFrame(animate)}

function setupFirebase(){try{if(!window.firebase){setMpStatus("Multiplayer unavailable: Firebase scripts did not load.");return}if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);firebase.auth().signInAnonymously().then(c=>{uid=c.user.uid;db=firebase.database();watchMultiplayer()}).catch(e=>setMpStatus("Multiplayer unavailable: "+((e&&e.code)||"unknown error")))}catch(e){setMpStatus("Multiplayer unavailable; single-player still works.")}}
