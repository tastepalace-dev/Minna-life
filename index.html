<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minna Life</title>
<style>
:root{--bg:#edf1e8;--card:#fffdf6;--ink:#203126;--muted:#68756b;--green:#245b3e;--gold:#e0a936;--line:#d9e0d5}
*{box-sizing:border-box}
body{margin:0 auto;max-width:620px;padding:12px;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,Arial,sans-serif}
h1{font-size:28px;margin:0;color:var(--green)} h2{font-size:18px;margin:0 0 9px}
.sub{color:var(--muted);margin:3px 0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:12px 0}
button,input{font:inherit;border-radius:10px;padding:10px;border:1px solid var(--line)}
button{background:var(--green);color:white;font-weight:700;cursor:pointer;border:0;min-height:40px}
button.gold{background:var(--gold);color:#30230a}button:disabled{opacity:.5}
input{width:100%;background:white;color:#203126;margin:6px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bar{height:8px;background:#dce3d9;border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#268c99}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row small{display:block;color:var(--muted)}
.towns{display:flex;gap:7px;flex-wrap:wrap}.town{background:#fff;color:var(--ink);border:1px solid var(--line)}.town.on{background:var(--gold);color:#30230a}
#world{display:block;width:100%;height:auto;border-radius:15px;border:2px solid #d4dfca;background:#9ac77f;touch-action:manipulation}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:260px;margin:10px auto}.controls button{font-size:20px;padding:8px}
.log p{margin:5px 0;font-size:14px}.chat{max-height:150px;overflow:auto;font-size:14px}.chat p{margin:4px 0;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><h1>Minna Life</h1><p class="sub">Explore Minna, earn money, eat, work and build your life.</p></header>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
"use strict";
const TOWNS={
 minna:{name:"Minna",desc:"State capital — markets, schools, homes and busy roads.",fare:0,
 jobs:[["Keke rider",2500,24,14],["Market trader",2000,20,12],["Recharge-card seller",1700,15,10],["Shop assistant",2200,18,12]],
 food:[["Jollof rice",1200,40],["Shawarma",2500,35],["Eba and egusi soup",1000,45],["Tuwo and miyan kuka",800,40],["Suya",1500,30],["Rice and beans",900,35]]},
 bida:{name:"Bida",desc:"Nupe heritage, crafts and farming.",fare:2000,
 jobs:[["Brass worker",3200,30,18],["Farmer",2200,28,16],["Fura da nono seller",1800,15,10]],
 food:[["Gbegi and egusi",900,40],["Fura da nono",500,20],["Jollof rice",1200,40],["Eba and egusi soup",1000,45],["Shawarma",2500,35]]},
 suleja:{name:"Suleja",desc:"A busy town close to Abuja.",fare:3000,
 jobs:[["Bus conductor",2600,22,14],["Market trader",2300,20,12],["Tour guide",3000,22,12]],
 food:[["Jollof and chicken",1800,45],["Akara and pap",600,25],["Shawarma",2500,35],["Eba and egusi soup",1000,45]]}
};
const HOMES=[["Sleep outside",0,45],["Single room",1500,85],["Self-contain",4000,100],["Two-bedroom flat",10000,100]];
const KEY="minnaLifeSaveV1";
let S=null, px=180, py=245, ctx=null, world=null, lastMove=0;
function money(n){return "₦"+Math.round(n).toLocaleString("en-NG")}
function clamp(n){return Math.max(0,Math.min(100,n))}
function say(msg){S.log.unshift(msg);S.log=S.log.slice(0,6)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} syncPlayer()}
function start(type){const name=document.getElementById("playerName").value.trim().slice(0,20);if(!name){alert("Enter a character name first.");return}
S={name,cash:type==="comfortable"?50000:1500,energy:100,food:80,day:1,town:"minna",home:type==="comfortable"?1:0,xp:0,log:["Welcome to Minna, "+name+"! Your journey begins."]};px=180;py=245;save();render()}
function multiplier(){return 1+Math.floor(S.xp/8)*0.1}
function work(i){const j=TOWNS[S.town].jobs[i];if(S.energy<j[2]){say("You're tired. Sleep to restore energy.");render();return}if(S.food<10){say("You're too hungry to work. Eat first.");render();return}
let pay=Math.round(j[1]*multiplier());if(Math.random()<.2){const tip=Math.round(pay*.3);pay+=tip;say("A customer tipped you "+money(tip)+"!")}S.cash+=pay;S.energy=clamp(S.energy-j[2]);S.food=clamp(S.food-j[3]);S.xp++;say(j[0]+": you earned "+money(pay)+".");save();render()}
function eat(i){const f=TOWNS[S.town].food[i];if(S.cash<f[1]){say("Not enough money for "+f[0]+".");render();return}S.cash-=f[1];S.food=clamp(S.food+f[2]);say("You ate "+f[0]+" for "+money(f[1])+".");save();render()}
function sleep(){const h=HOMES[S.home];if(S.cash<h[1]){say("You can't afford to sleep here tonight.");render();return}S.cash-=h[1];S.energy=clamp(S.energy+h[2]);S.food=clamp(S.food-20);S.day++;say("Day "+S.day+": rested at "+h[0]+".");if(S.home===0&&Math.random()<.2){let loss=Math.min(S.cash,500);S.cash-=loss;if(loss)say("You lost "+money(loss)+" while sleeping outside.")}save();render()}
function chooseHome(i){S.home=i;say("Your home is now: "+HOMES[i][0]+".");save();render()}
function travel(t){if(t===S.town)return;const cost=t==="minna"? (S.town==="bida"?2000:3000):(t==="bida"?(S.town==="minna"?2000:4500):3000);if(S.cash<cost){say("You need "+money(cost)+" for that trip.");render();return}S.cash-=cost;S.energy=clamp(S.energy-10);S.town=t;px=180;py=245;say("You travelled to "+TOWNS[t].name+" for "+money(cost)+".");save();render()}
function bar(label,value,color){return `<div>${label} ${Math.round(value)}%<div class="bar"><i style="width:${value}%;background:${color}"></i></div></div>`}
function render(){const a=document.getElementById("app");if(!S){a.innerHTML=`<div class="card"><h2>Create your character</h2><label for="playerName">Character name</label><input id="playerName" maxlength="20" placeholder="e.g. Musa"><button style="width:100%;margin:4px 0 8px" onclick="start('comfortable')">Comfortable start — ₦50,000</button><button class="gold" style="width:100%" onclick="start('hustle')">Hustle start — ₦1,500</button></div>`;return}
let html=`<div class="card"><div class="row" style="border:0;padding-top:0"><div><b>${esc(S.name)}</b><small>Day ${S.day} · Earnings bonus ×${multiplier().toFixed(1)}</small></div><button class="gold" onclick="resetGame()">Reset</button></div><h2>${money(S.cash)}</h2><div class="stats">${bar("Energy",S.energy,"#2c8d9a")}${bar("Fullness",S.food,"#d8a12e")}</div></div>
<div class="card"><h2>Your city</h2><canvas id="world" width="360" height="500" aria-label="Minna city map"></canvas><div class="controls"><span></span><button onclick="move(0,-18)">▲</button><span></span><button onclick="move(-18,0)">◀</button><button class="gold" onclick="move(0,18)">▼</button><button onclick="move(18,0)">▶</button></div><p class="muted">Tap a place on the map or use the arrow buttons to move.</p><div class="towns">${Object.keys(TOWNS).map(t=>`<button class="town ${S.town===t?"on":""}" onclick="travel('${t}')">${TOWNS[t].name}</button>`).join("")}</div><p class="muted">${TOWNS[S.town].desc}</p></div>
<div class="card"><h2>Jobs in ${TOWNS[S.town].name}</h2>${TOWNS[S.town].jobs.map((j,i)=>`<div class="row"><div>${esc(j[0])}<small>Earn ${money(j[1]*multiplier())} · uses ${j[2]} energy</small></div><button onclick="work(${i})">Work</button></div>`).join("")}</div>
<div class="card"><h2>Food market</h2>${TOWNS[S.town].food.map((f,i)=>`<div class="row"><div>${esc(f[0])}<small>${money(f[1])} · +${f[2]} fullness</small></div><button class="gold" onclick="eat(${i})">Eat</button></div>`).join("")}</div>
<div class="card"><h2>Home</h2>${HOMES.map((h,i)=>`<div class="row"><div>${esc(h[0])}<small>${h[1]?money(h[1])+" per night":"Free, but risky"} · restores ${h[2]} energy</small></div><button ${S.home===i?"disabled":""} class="${S.home===i?"":"gold"}" onclick="chooseHome(${i})">${S.home===i?"Current":"Move in"}</button></div>`).join("")}<button style="width:100%;margin-top:10px" onclick="sleep()">Sleep until morning</button></div>
<div class="card log"><h2>Recent events</h2>${S.log.map(x=>`<p>${esc(x)}</p>`).join("")}</div>
<div class="card"><h2>Town chat (optional)</h2><p class="muted" id="mpStatus">Connecting to multiplayer…</p><div id="chat" class="chat"><p class="muted">Chat will appear here if Firebase is configured and its rules allow access.</p></div><div class="row"><input id="chatInput" maxlength="120" placeholder="Write a town message"><button onclick="sendChat()">Send</button></div><h2 style="margin-top:10px">Richest players</h2><div id="leaderboard"><p class="muted">Loading…</p></div></div>`;
a.innerHTML=html;world=document.getElementById("world");ctx=world.getContext("2d");drawWorld()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function drawWorld(){if(!ctx||!S)return;ctx.clearRect(0,0,360,500);
ctx.fillStyle="#a5ce88";ctx.fillRect(0,0,360,500);
// garden patches
ctx.fillStyle="#8fbd78";ctx.fillRect(0,0,125,190);ctx.fillRect(235,0,125,190);ctx.fillRect(0,315,125,185);ctx.fillRect(235,315,125,185);
// roads and intersection
ctx.fillStyle="#858982";ctx.fillRect(135,0,90,500);ctx.fillRect(0,205,360,100);
ctx.strokeStyle="#f4e6a6";ctx.lineWidth=2;ctx.setLineDash([12,12]);ctx.beginPath();ctx.moveTo(180,0);ctx.lineTo(180,195);ctx.moveTo(180,315);ctx.lineTo(180,500);ctx.moveTo(0,255);ctx.lineTo(125,255);ctx.moveTo(235,255);ctx.lineTo(360,255);ctx.stroke();ctx.setLineDash([]);
function building(x,y,w,h,wall,roof,label){ctx.fillStyle="#65432c";ctx.fillRect(x-4,y+7,w+8,h);ctx.fillStyle=roof;ctx.beginPath();ctx.moveTo(x-7,y+8);ctx.lineTo(x+w/2,y-12);ctx.lineTo(x+w+7,y+8);ctx.closePath();ctx.fill();ctx.fillStyle=wall;ctx.fillRect(x,y+8,w,h-8);ctx.fillStyle="#f8e6b7";ctx.fillRect(x+9,y+20,17,18);ctx.fillRect(x+w-26,y+20,17,18);ctx.fillStyle="#60452f";ctx.fillRect(x+w/2-7,y+h-14,14,22);ctx.fillStyle="#fff";ctx.font="bold 9px Arial";ctx.fillText(label,x+4,y+18)}
function stall(x,y,w,label,roof){ctx.fillStyle="#744a2d";ctx.fillRect(x,y+28,w,28);ctx.fillStyle=roof;ctx.fillRect(x-3,y,w+6,25);for(let n=0;n<4;n++){ctx.fillStyle=n%2?"#fff0cf":"#bd4933";ctx.fillRect(x+n*w/4,y,w/4,25)}ctx.fillStyle="#f6e3b7";ctx.fillRect(x+4,y+30,w-8,20);for(let n=0;n<4;n++){ctx.fillStyle=["#d83d28","#e6b332","#6b9a43","#fff0b0"][n];ctx.beginPath();ctx.arc(x+10+n*(w-20)/3,y+39,5,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#fff";ctx.font="bold 8px Arial";ctx.fillText(label,x+2,y-4)}
stall(12,38,95,"FOOD MARKET","#d8a34b");stall(248,38,94,"MINNA SHOP","#c65a3d");
building(15,350,100,62,"#dfc99e","#8c5133","HOUSE");building(245,350,100,62,"#e6d9ad","#b84b35","CLINIC");
// trees
for(let i=0;i<6;i++){const x=18+i*20;ctx.fillStyle="#77512e";ctx.fillRect(x-2,145,4,10);ctx.fillStyle="#286b3b";ctx.beginPath();ctx.arc(x,143,8,0,Math.PI*2);ctx.fill()}
for(let i=0;i<6;i++){const x=245+i*20;ctx.fillStyle="#77512e";ctx.fillRect(x-2,145,4,10);ctx.fillStyle="#286b3b";ctx.beginPath();ctx.arc(x,143,8,0,Math.PI*2);ctx.fill()}
// character
ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(px,py+9,9,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#234cc5";ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 10px Arial";ctx.textAlign="center";ctx.fillText(S.name.slice(0,12),px,py-14);ctx.textAlign="left";
ctx.fillStyle="#203126";ctx.font="bold 12px Arial";ctx.fillText(S.town.toUpperCase()+" · EXPLORE",8,488)}
function move(dx,dy){px=Math.max(12,Math.min(348,px+dx));py=Math.max(15,Math.min(470,py+dy));drawWorld()}
function resetGame(){if(confirm("Reset your Minna Life progress?")){localStorage.removeItem(KEY);S=null;render()}}
const FIREBASE_CONFIG={apiKey:"AIzaSyA1Lqg-LgHHLu-BLSv6DyrD8y8zc3LsnbQ",authDomain:"niger-life.firebaseapp.com",databaseURL:"https://niger-life-default-rtdb.firebaseio.com",projectId:"niger-life",storageBucket:"niger-life.firebasestorage.app",messagingSenderId:"128854659544",appId:"1:128854659544:web:b992a6d34db489c2fb22ad"};
let db=null,uid=null,chatRef=null,playersRef=null;
function setupFirebase(){try{if(!window.firebase)return;firebase.initializeApp(FIREBASE_CONFIG);firebase.auth().signInAnonymously().then(cred=>{uid=cred.user.uid;db=firebase.database();watchMultiplayer()}).catch(()=>setMpStatus("Multiplayer unavailable. Check Firebase Authentication settings."))}catch(e){setMpStatus("Multiplayer unavailable; the single-player game still works.")}}
function setMpStatus(text){const el=document.getElementById("mpStatus");if(el)el.textContent=text}
function syncPlayer(){if(!db||!uid||!S)return;db.ref("players/"+uid).update({name:S.name,cash:Math.round(S.cash),town:S.town,day:S.day}).catch(()=>{})}
function watchMultiplayer(){if(!db)return;const status=document.getElementById("mpStatus");if(status)status.textContent="Multiplayer connected when Firebase rules permit.";
playersRef=db.ref("players").orderByChild("cash").limitToLast(10);playersRef.on("value",snap=>{const el=document.getElementById("leaderboard");if(!el)return;let list=[];snap.forEach(c=>list.unshift(c.val()));el.innerHTML=list.length?list.map((p,i)=>`<div class="row"><div>${i+1}. ${esc(p.name||"Player")}<small>${esc((TOWNS[p.town]||{name:"Unknown"}).name)}</small></div><b>${money(p.cash||0)}</b></div>`).join(""):'<p class="muted">No players yet.</p>'},()=>setMpStatus("Firebase database rules need setup; single-player still works."));
if(S)syncPlayer();loadChat()}
function loadChat(){if(!db||!S)return;if(chatRef)chatRef.off();chatRef=db.ref("chat/"+S.town).limitToLast(20);chatRef.on("value",snap=>{const el=document.getElementById("chat");if(!el)return;let arr=[];snap.forEach(c=>arr.push(c.val()));el.innerHTML=arr.length?arr.map(m=>`<p><b>${esc(m.n||"Player")}:</b> ${esc(m.m||"")}</p>`).join(""):'<p class="muted">No messages yet.</p>'},()=>setMpStatus("Chat unavailable until Firebase database rules are configured."))}
function sendChat(){const input=document.getElementById("chatInput");if(!input||!db||!S){alert("Chat is not connected yet. The game itself still works.");return}const msg=input.value.trim().slice(0,120);if(!msg)return;input.value="";db.ref("chat/"+S.town).push({n:S.name,m:msg,t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>setMpStatus("Could not send chat. Check Firebase database rules."))}
function load(){try{const v=localStorage.getItem(KEY);if(v)S=JSON.parse(v)}catch(e){S=null}}
load();render();setupFirebase();
</script>
</body>
</html>
