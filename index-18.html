<div class="card"><h2>School</h2>${SCHOOL.map((c,i)=>`<div class="row"><div>${esc(c[0])}<small>${money(c[1])} · earnings +${Math.round(c[2]/8*10)}%</small></div><button class="${lr[i]?"":"gold"}" ${lr[i]?"disabled":""} onclick="learn(${i})">${lr[i]?"Done":"Enrol"}</button></div>`).join("")}</div>`}

let npcs=[],trf=[],npcTown=null,tk=0;

function buyGood(i){let g=GOODS[i];if(!g||S.items[g[0]])return;if(S.cash<g[2]){say("You need "+money(g[2])+" for the "+g[1]+".");render();return}S.cash-=g[2];S.items[g[0]]=true;S.fame=(S.fame||0)+g[5];say("You bought a "+g[1]+". "+g[3]);save();render()}

function nearB(){let r=null,bd=50;BLD.forEach(b=>{let dx=Math.max(b.x-px,0,px-(b.x+b.w)),dy=Math.max(b.y-py,0,py-(b.y+b.h)),d=Math.hypot(dx,dy);if(d<bd){bd=d;r=b}});return r}
function heal(){if(S.cash<1500){say("You can't afford treatment (\u20A61,500).");render();return}S.cash-=1500;S.energy=clamp(S.energy+40);S.food=clamp(S.food+20);say("The clinic treated you for \u20A61,500.");save();render()}
function inner(h){return h.replace(/<div class="card">/g,"<div>")}
function panel(b){let T=TOWNS[S.town],h="";switch(b.k){
case"food":h="<h2>Food Market</h2>"+T.food.map((f,i)=>`<div class="row"><div>${esc(f[0])}<small>${money(f[1])} · +${f[2]} fullness</small></div><button class="gold" onclick="eat(${i})">Eat</button></div>`).join("");break;
case"work":h="<h2>Jobs in "+esc(T.name)+"</h2>"+T.jobs.map((j,i)=>`<div class="row"><div>${esc(j[0])}<small>Earn about ${money(j[1]*multiplier())} · uses ${j[2]} energy${need(j)?" · needs "+esc(need(j)):""}</small></div><button ${need(j)?"disabled":""} onclick="work(${i})">Work</button></div>`).join("");break;
case"home":h="<h2>Your House</h2>"+'<button class="gold" style="width:100%;margin-bottom:8px" onclick="openHouse()">🏠 Go inside your house</button>'+HOMES.map((x,i)=>`<div class="row"><div>${esc(x[0])}<small>${x[1]?money(x[1])+" per night":"Free, but risky"} · restores ${x[2]} energy</small></div><button ${S.home===i?"disabled":""} class="${S.home===i?"":"gold"}" onclick="chooseHome(${i})">${S.home===i?"Current":"Move in"}</button></div>`).join("")+'<button style="width:100%;margin-top:10px" onclick="sleep()">Sleep until morning</button>';break;
case"clinic":h=`<h2>Clinic</h2><div class="row"><div>Treatment<small>\u20A61,500 · +40 energy, +20 fullness</small></div><button class="gold" onclick="heal()">Get treated</button></div>`;break;
case"club":h=inner(nightHTML());break;
case"garage":h=inner(storeHTML().split('<div class="card"><h2>Businesses')[0]);break;
case"estate":h=inner('<div class="card"><h2>Businesses'+storeHTML().split('<div class="card"><h2>Businesses')[1]);break;
case"mall":h=inner(goodsHTML());break;
case"bank":{let m=moreHTML();h=inner(bankHTML()+m.slice(m.indexOf('<div class="card"><h2>Microloan'),m.indexOf('<div class="card"><h2>School')));break}
case"school":{let m=moreHTML();h=inner(m.slice(m.indexOf('<div class="card"><h2>School')));break}
case"wheel":{let m=moreHTML();h=inner(m.slice(0,m.indexOf('<div class="card"><h2>Microloan'))+spinHTML());break}
case"hall":h=inner(politicsHTML()+achHTML());break;
case"park":h="<h2>Motor Park</h2>"+Object.keys(TOWNS).filter(t=>t!==S.town).map(t=>`<div class="row"><div>${esc(TOWNS[t].name)}<small>Fare ${money(Math.round(baseFare(S.town,t)*(1-(best()?best()[5]:0))))}</small></div><button class="gold" onclick="travel('${t}')">Go</button></div>`).join("");break}
return lmLine(b)+h}
function updateNear(){let el=document.getElementById("near");if(!el||!S)return;let b=nearB(),nn=b?null:nearNPC(),ln=nn?Math.floor(Date.now()/9000)%nn.lines.length:0,key=forcePanel?"f"+forcePanel+ST:(b?b.k+S.town+isNight():(nn?"npc"+nn.n+ln:"none"));if(key===lastNear&&el.innerHTML)return;lastNear=key;
if(forcePanel==="send"){el.innerHTML=inner(sendHTML());return}
if(nn){el.innerHTML="<h2>"+esc(nn.n)+' <span class="muted">(townsperson)</span></h2><p>\u201C'+esc(nn.lines[ln])+"\u201D</p>";return}
if(!b){el.innerHTML='<h2>Around you</h2><p class="muted">Walk or tap a building to go inside. Tap another player to send them money.</p>';return}
el.innerHTML=panel(b)}
function ownHTML(){let c=["🏠 "+HOMES[S.home][0]];VEH.forEach(v=>{if(S.items[v[0]])c.push(v[3]+" "+v[1])});GOODS.forEach(g=>{if(S.items[g[0]])c.push(g[3]+" "+g[1])});if(S.items.gen)c.push("🔌 Generator");BIZ.forEach(b=>{if(S.biz[b[0]])c.push("🏪 "+b[1])});SCHOOL.forEach((x,i)=>{if(S.learn[i])c.push("🎓 "+x[0])});if(S.office)c.push("🏛️ "+OFFICES[S.office-1][0]);if(S.bank)c.push("💰 Savings "+money(S.bank));if(S.debt)c.push("🧾 Debt "+money(S.debt));c.push("🏆 "+Object.keys(S.ach||{}).length+"/"+ACH.length+" achievements");return c.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}
function collides(x,y){let r=9;return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
function move(dx,dy){if(!S||!world)return;forcePanel=null;let f=Math.min(spd(),2)*(1-.3*wx.rain);dx*=f;dy*=f;let nx=Math.max(10,Math.min(350,px+dx)),ny=Math.max(12,Math.min(700,py+dy));if(!collides(nx,py))px=nx;if(!collides(px,ny))py=ny;slip();drawWorld();pushPos();updateNear()}
function tapMove(e){if(!world||!S)return;let r=world.getBoundingClientRect(),tx=(e.clientX-r.left)*360/r.width,ty=(e.clientY-r.top)*VH/r.height+camY-OY;
let hp=Object.keys(others).find(k=>Math.hypot(others[k].x-tx,others[k].y-ty)<22);if(hp){ST=hp;forcePanel="send";updateSend();lastNear="";updateNear();return}
forcePanel=null;let hb=BLD.find(b=>tx>=b.x&&tx<=b.x+b.w&&ty>=b.y&&ty<=b.y+b.h);
if(hb){if(hb.k==="park"){tx=180;ty=hb.y-16}else if(hb.k==="wheel"){tx=192;ty=227}else if(hb.x<130){tx=hb.x+hb.w+14;ty=hb.y+hb.h/2}else{tx=hb.x-14;ty=hb.y+hb.h/2}}
let dx=tx-px,dy=ty-py,d=Math.hypot(dx,dy);if(d<8)return;let sp=8*Math.min(spd(),2.2)*(1-.3*wx.rain),steps=Math.ceil(d/sp),step=0;function animate(){if(step++>=steps)return;let ox=px,oy=py,nx=px+dx/d*sp,ny=py+dy/d*sp;if(!collides(nx,py))px=nx;if(!collides(px,ny))py=ny;slip();drawWorld();pushPos();updateNear();if(px===ox&&py===oy)return;requestAnimationFrame(animate)}requestAnimationFrame(animate)}

function setupFirebase(){try{if(!window.firebase){setMpStatus("Multiplayer unavailable: Firebase scripts did not load.");return}if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);firebase.auth().signInAnonymously().then(c=>{uid=c.user.uid;db=firebase.database();watchMultiplayer()}).catch(e=>setMpStatus("Multiplayer unavailable: "+((e&&e.code)||"unknown error")))}catch(e){setMpStatus("Multiplayer unavailable; single-player still works.")}}

function watchPlayers(){if(!db||!S)return;if(posTown){db.ref("positions/"+posTown).off();db.ref("positions/"+posTown+"/"+uid).remove()}posTown=S.town;others={};let r=db.ref("positions/"+posTown);r.on("value",snap=>{let o={};snap.forEach(c=>{let v=c.val();if(c.key!==uid&&v&&typeof v.x==="number"&&typeof v.y==="number")o[c.key]=v});others=o;updateSend();drawWorld()},()=>{});r.child(uid).onDisconnect().remove()}
